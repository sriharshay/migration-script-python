excel:
  file_path: "excel.xlsx"
  columns:
    - "ID"
ms:
  endpoint: "https://www.endpoint.com?dataid=<ID>&typeId=1&testName=<Name>&interfaceId=3"
aem:
  endpoint: "http://localhost:4502/bin/create-article.json"
  username: "admin"
  password: "admin"
  enabled: true
  base_url: "http://localhost:4502"
  retries: 1
  retry_delay: 3
  timeout: 10

aem_images:
  base_path: "/content/dam/hns-import"
  intermediate_folders: ["category", "subcategory"]
  download_retries: 1
  timeout: 10

processing_rules:
  max_depth: 6
  exclude_selectors:
    - 'div.helper-class'
    - 'span.temporary'
    - '[data-testid]'
  allowed_attributes:
    - 'class'
    - 'id'
    - 'src'
    - 'alt'
    - 'href'
    - 'title'
    - 'width'
    - 'height'

components:
  accordion:
    selectors: ['div.accordionparagraph']
    property_map:
      title: 'div.accordion-header label, div.accordion-header'
      content: 'div.accordion-content'

  text:
    selectors: ['div.type_paragraph']
    property_map:
      content: 'self'

  image:
    selectors: ['img']
    property_map:
      src: 'img[src]'
      alt: 'img[alt]'
      width: 'img[width]'
      height: 'img[height]'

  table:
    selectors: ['table']
    property_map:
      html: 'self'

  video:
    selectors: ['iframe[src*="youtube.com"]']
    property_map:
      embedUrl: 'iframe[src]'

resource_types:
  accordion: '/apps/my-project/components/accordion'
  text: '/apps/my-project/components/text'
  image: '/apps/my-project/components/image'
  table: '/apps/my-project/components/table'
  video: '/apps/my-project/components/video'
