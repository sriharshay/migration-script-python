excel:
  file_path: "data.xlsm"
  columns:
    - "ID"
ms:
  endpoint: "https://daas4uyngl.execute-api.ap-southeast-2.amazonaws.com/prod/hs/v1/article?questionId=<ID>&typeId=1&id=<ID>&interfaceId=3"
  retries: 0 # Microservice call
  timeout: 10 # Microservice call
  retry_delay: 1 # Microservice call

aem:
  base_url: http://localhost:4502
  endpoint: "/bin/import.json"
  username: "admin"
  password: "admin"
  enabled: true
  retries: 0 # AEM Image Upload
  timeout: 10 # AEM Image Upload
  retry_delay: 1 # AEM Image Upload

aem_images:
  base_path: "/content/dam/import/migration"
  intermediate_folders: ["category", "subcategory"]
  retries: 0 # Download the cached images from S3
  timeout: 10 # Download the cached images from S3
  retry_delay: 1 # Download the cached images from S3

processing_rules:
  max_depth: 6
  exclude_selectors:
    - 'div.helper-class'
    - 'span.temporary'
    - '[data-testid]'
  allowed_attributes:
    - 'class'
    - 'id'
    - 'src'
    - 'alt'
    - 'href'
    - 'title'
    - 'width'
    - 'height'

components:
  accordion:
    selectors: ['div.accordionparagraph']
    property_map:
      title: 'div.accordion-header label, div.accordion-header'
      content: 'div.accordion-content'

  text:
    selectors: ['div.type_paragraph']
    property_map:
      content: 'self'

  image:
    selectors: ['img']
    property_map:
      src: 'img[src]'
      alt: 'img[alt]'
      width: 'img[width]'
      height: 'img[height]'

  table:
    selectors: ['table']
    property_map:
      html: 'self'

  video:
    selectors: ['iframe[src*="youtube.com"]']
    property_map:
      embedUrl: 'iframe[src]'

resource_types:
  accordion: '/apps/my-project/components/accordion'
  text: '/apps/my-project/components/text'
  image: '/apps/my-project/components/image'
  table: '/apps/my-project/components/table'
  video: '/apps/my-project/components/video'
